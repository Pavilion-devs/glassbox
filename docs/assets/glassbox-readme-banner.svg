<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 100 700; font-display: block; src: url('/fonts/plex-sans-var.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: block; src: url('/fonts/plex-mono-400.woff2') format('woff2'); }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: block; src: url('/fonts/plex-mono-600.woff2') format('woff2'); }
      text { font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f3ef"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2352"/>
      <stop offset="0.5" stop-color="#5a4fd0"/>
      <stop offset="1" stop-color="#a99cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#eceae3" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#2a2734" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L6.5 3 L0 6 Z" fill="#b9b4ad"/>
    </marker>

    <symbol id="ic-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="ic-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 4 14h6l-1 7 9-11h-6z"/></symbol>
    <symbol id="ic-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 7-7 8-3.5-1-7-3-7-8V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  </defs>

  <rect width="2400" height="800" fill="url(#bg)"/>
  <rect width="2400" height="800" fill="url(#grid)"/>
  <ellipse cx="1780" cy="180" rx="520" ry="300" fill="#5a4fd0" opacity="0.10" filter="url(#blur)"/>
  <ellipse cx="360" cy="720" rx="420" ry="240" fill="#216a53" opacity="0.07" filter="url(#blur)"/>

  <!-- ============================ left: identity ============================ -->
  <g transform="translate(150 232)">
    <rect x="0" y="0" width="92" height="92" rx="24" fill="url(#mark)"/>
    <rect x="21" y="19" width="34" height="47" rx="10" fill="none" stroke="#ffffff" stroke-width="5.5" transform="rotate(-10 38 42)"/>
    <rect x="44" y="33" width="34" height="47" rx="10" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-opacity="0.6" transform="rotate(7 61 56)"/>
  </g>

  <text x="270" y="298" font-size="72" font-weight="700" fill="#29282e" letter-spacing="-2.4">GlassBox</text>

  <text x="152" y="404" font-size="34" font-weight="600" fill="#4a4752" letter-spacing="-0.7">Know when an AI-agent decision is no longer safe to trust.</text>

  <text x="152" y="456" font-size="23" fill="#5f5c66">Data lineage tells you where data went.</text>
  <text x="152" y="492" font-size="23" fill="#5f5c66">GlassBox tells you what your agents did because of it.</text>

  <!-- capability chips -->
  <g transform="translate(152 546)">
    <rect x="0" y="0" width="236" height="46" rx="12" fill="#ffffff" stroke="#e5e2dc"/>
    <text class="mono" x="20" y="29" font-size="17" fill="#4a4752">Signed receipts</text>

    <rect x="252" y="0" width="288" height="46" rx="12" fill="#ffffff" stroke="#e5e2dc"/>
    <text class="mono" x="272" y="29" font-size="17" fill="#4a4752">Deterministic impact</text>

    <rect x="556" y="0" width="256" height="46" rx="12" fill="#ffffff" stroke="#e5e2dc"/>
    <text class="mono" x="576" y="29" font-size="17" fill="#4a4752">Governed replay</text>
  </g>

  <text class="mono" x="152" y="654" font-size="18" font-weight="600" fill="#5a4fd0" letter-spacing="2.6">OPEN SOURCE · DATAHUB-NATIVE · APACHE-2.0</text>

  <!-- ======================= right: the loop, abstracted ==================== -->
  <g transform="translate(1338 176)">
    <!-- 1 agent run -->
    <g>
      <rect x="0" y="0" width="392" height="132" rx="18" fill="#ffffff" stroke="#e5e2dc" filter="url(#soft)"/>
      <g transform="translate(28 30)" color="#5a4fd0"><use href="#ic-doc" width="28" height="28"/></g>
      <text x="74" y="42" font-size="14" font-weight="700" fill="#7c7882" letter-spacing="1.6">AGENT RUN</text>
      <text x="74" y="72" font-size="21" font-weight="600" fill="#29282e">Signed decision receipt</text>
      <text class="mono" x="28" y="108" font-size="15" fill="#5f5c66">gbx:receipt:sha256:dab8881a9a…</text>
    </g>

    <path d="M196 140 V 176" stroke="#b9b4ad" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- 2 metadata change -->
    <g transform="translate(0 186)">
      <rect x="0" y="0" width="392" height="132" rx="18" fill="#f7efdf" stroke="#ebdcc0" filter="url(#soft)"/>
      <g transform="translate(28 30)" color="#8a5d1f"><use href="#ic-bolt" width="28" height="28"/></g>
      <text x="74" y="42" font-size="14" font-weight="700" fill="#8a5d1f" letter-spacing="1.6">DATAHUB CHANGE</text>
      <text x="74" y="72" font-size="21" font-weight="600" fill="#29282e">A field it depended on moved</text>
      <text class="mono" x="28" y="108" font-size="15" fill="#8a5d1f">average_order_value · decimal → double</text>
    </g>

    <path d="M196 326 V 362" stroke="#b9b4ad" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- 3 verdict -->
    <g transform="translate(0 372)">
      <rect x="0" y="0" width="392" height="132" rx="18" fill="#ffffff" stroke="#ecd7da" filter="url(#soft)"/>
      <g transform="translate(28 30)" color="#a8394a"><use href="#ic-shield" width="28" height="28"/></g>
      <text x="74" y="42" font-size="14" font-weight="700" fill="#7c7882" letter-spacing="1.6">DETERMINISTIC VERDICT</text>
      <text x="74" y="72" font-size="21" font-weight="600" fill="#29282e">Quarantined, with a reason</text>
      <rect x="28" y="88" width="196" height="30" rx="9" fill="#faecef" stroke="#ecd7da"/>
      <text x="126" y="108" font-size="14" font-weight="700" fill="#a8394a" text-anchor="middle">STALE</text>
      <rect x="236" y="88" width="128" height="30" rx="9" fill="#f8f7f4" stroke="#e5e2dc"/>
      <text x="300" y="108" font-size="14" font-weight="600" fill="#5f5c66" text-anchor="middle">policy v1</text>
    </g>
  </g>

  <!-- right edge accent -->
  <rect x="2388" y="0" width="12" height="800" fill="#5a4fd0" opacity="0.9"/>
</svg>
